[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corppa"
description = "Software for working with Princeton Prosody Archive full-text corpus, including poetry detection"
authors = [
  {name = "Center for Digital Humanities at Princeton", email = "cdh-info@princeton.edu"},
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "Apache-2"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dynamic = ["version"]
dependencies = [
  "ftfy",
  "intspan",
  "orjsonl",
  "tqdm",
  "biopython>=1.86",
  "pyyaml",
  "polars",
  "polars-ds>=0.12.1",
  "rapidfuzz",
  "numpy"
]

[project.optional-dependencies]
type-checking = [
  "mypy",
  "types-tqdm",
]
doc = ["sphinx", "myst-parser"]
ocr = ["google-cloud-vision"]
poem_id = [
  "pyarrow",
  "unidecode",
  "rapidfuzz",
]
# NOTE: v0.5 and prior run against passim 7f52b95fc7f0314b6084a565c63bbde9e094a79f
# from Nov 24, 2024 a few bugfixes after the 2.0.1 release from Feb 2024
passim = ["passim @ git+https://github.com/dasmiq/passim.git"]
chadwyck_healey = ["bs4", "lxml"]
notebooks = ["jupyterlab", "itables", "treon", "polars", "altair"]
marimo = ["marimo", "marimo[lsp]"]
dev = [
  "pre-commit",
  "ruff",
  "corppa[type-checking]",
  "corppa[test]",
  "corppa[ocr]",
  "corppa[poem_id]",
  "corppa[passim]",
  "corppa[chadwyck_healey]",
  "corppa[doc]",
  "corppa[notebooks]",
  "corppa[marimo]",
]
test = [
  "pytest",
  "pytest-cov",
  "corppa[poem_id]",
  "corppa[chadwyck_healey]",
  "corppa[notebooks]",
]

[project.scripts]
corppa-filter = "corppa.utils.filter:main"
corppa-ocr = "corppa.ocr.gvision_ocr:main"
collate-txt = "corppa.ocr.collate_txt:main"
refmatcha = "corppa.poetry_detection.refmatcha:main"
merge-excerpts = "corppa.poetry_detection.merge_excerpts:main"
corppa-compile-dataset = "corppa.poetry_detection.compile_dataset:main"

[tool.hatch.version]
path = "src/corppa/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# configure src path so ruff import fixes can identify local imports
src = ["src"]

[tool.hatch.metadata]
# so passim can be installed from GitHub (i.e., direct reference)
allow-direct-references = true

[tool.coverage.report]
exclude_lines = [
    "# pragma: no cover",
    # skip command-line configuration for main method on scripts
    "if __name__ == .__main__.:"
]

[tool.ruff.lint]
select = [
# ruff defaults
"E4",
"E7",
"E9",
"F",
# isort
"I",
]
# Can use to ignore specific rules within above selection
ignore = []

[tool.marimo.display]
cell_output = "below"

[tool.marimo.runtime]
# Add project source directory to Python path
pythonpath = ["src"]

[tool.marimo.save]
format_on_save = true

[tool.marimo.diagnostics]
enabled = true

[tool.marimo.experimental]
lsp = true
